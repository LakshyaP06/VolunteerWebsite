<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login or Sign Up</title>
    <!-- Bootstrap CSS Framework -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <!-- Custom CSS -->
    <style>
        :root {
            --mdc-theme-primary: #ffffff;
            --mdc-theme-secondary: #6c757d;
            --mdc-theme-background: #f5f5f5;
            --mdc-theme-surface: #ffffff;
            --mdc-theme-on-primary: #ffffff;
            --mdc-theme-on-secondary: #000000;
            --mdc-theme-on-surface: #000000;
            --mdc-theme-error: #b00020;
            --mdc-theme-on-error: #ffffff;
        }

        body {
            background: var(--mdc-theme-background);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        .container {
            max-width: 1200px;
            display: flex;
            border-radius: 12px;
        }

        .left-pane {
            flex: 1;
            background-color: #3B6E71;
            color: #ffffff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        .left-pane object {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        .right-pane {
            flex: 1;
            background-color: #ffffff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            color: #333;
        }

        .form-control::placeholder {
            color: #b3b3b3;
        }

        .btn-custom {
            background-color: var(--mdc-theme-primary);
            color: #000000;
            border: none;
            border-radius: 8px;
            height: 48px;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
            width: 100%;
            box-shadow: 0 0 0 3px var(--mdc-theme-primary), 0 0 0 4px rgba(0, 0, 0, 0.1);
        }

        .form-group label {
            color: var(--mdc-theme-secondary);
        }

        .social-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            border-radius: 8px;
            color: #000000;
            text-decoration: none;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
            box-shadow: 0 0 0 3px #ffffff, 0 0 0 4px rgba(0, 0, 0, 0.1);
        }

        .social-btn:hover {
            text-decoration: underline;
            color: var(--mdc-theme-on-secondary);
        }

        .btn-google {
            background-color: #ffffff;
        }

        .social-btn i {
            margin-right: 10px;
        }

        .signup-link {
            color: var(--mdc-theme-secondary);
            text-align: center;
            margin-top: 20px;
            display: block;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: var(--mdc-theme-primary);
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .or-text {
            color: var(--mdc-theme-on-surface);
            text-align: center;
            margin: 20px 0;
        }

        .or-line {
            width: 100%;
            height: 1px;
            background-color: #ffffff;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .social-btn {
                margin: 10px 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-pane">
            <object type="image/svg+xml" data="/svg/logo.svg" width="100%" height="auto"></object>
        </div>
        <div class="right-pane">
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password"
                        required>
                </div>
                <div class="forgot-password">
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-custom">Login</button>
            </form>
            <div class="social-btns">
                <a href="/auth/google" class="social-btn btn-google">
                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo"
                        style="height: 24px; width: 24px; margin-right: 10px;">
                    Google
                </a>
            </div>
            <a href="/signup-page.html" class="signup-link">Don't have an account? Sign Up</a>
        </div>
    </div>

    <!-- Error Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1" role="dialog" aria-labelledby="errorModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">Error</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="errorModalBody">
                    <!-- Error message will be displayed here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap and jQuery Scripts -->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <!-- Custom JavaScript -->
    <script>
        function showErrorModal(message) {
            $('#errorModalBody').text(message);
            $('#errorModal').modal('show');
        }

        $('#loginForm').on('submit', function(event) {
            event.preventDefault();
            const formData = $(this).serialize();

            $.post('/login', formData, function(response) {
                // Handle success
                window.location.href = '/';
            }).fail(function(xhr) {
                showErrorModal(xhr.responseJSON.error);
            });
        });
    </script>
</body>

</html>
